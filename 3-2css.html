<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>120蔡美琪</title>
    <style>
        h3 {
            color: rgb(227, 66, 66);
        }
        p {
            color: rgb(122, 219, 12);
        }
        /*id选择器*/
        #box {
            width: 500px;
            height: 300px;
            background-color: rgb(173, 204, 87);
        }
        /*三个字分别设置颜色，span默认同一行*/
        .zi1{
            color:#1e1a96;
        }
        .zi2{
            color:#d7ce22;
        }
        .zi3{
            color:#e63acf;
        }
        /*扩展1：h2黑底白字*/
        h2{
            background-color: black;
            color: white;
        }
        /*扩展3：选择器三个字白色*/
        .white-text{
            color:white;
        }
        /*扩展4：学号盒子，宽高背景*/
        #stu-box{
            width: 400px;
            height: 150px;
            background-color: #33c3f7;
        }
    </style>
</head>
<body>
    <a href="./index.html" aria-label="返回首页" style="position:fixed;top:12px;right:12px;z-index:9999;padding:9px 14px;border-radius:999px;background:#426b50;color:#fff;text-decoration:none;font:14px 'Microsoft YaHei',sans-serif;box-shadow:0 3px 12px rgba(0,0,0,.18)">← 返回首页</a>
    <h2>层叠样式表css</h2>
    <div id="box">
        <h3>CSS选择器</h3>
        <!-- span是行内元素，默认在同一行显示 -->
        <!-- 扩展3：选择器三个字白色 -->
        <p><span class="white-text">选</span><span class="white-text">择</span><span class="white-text">器</span></p>
        <!-- 扩展2：名字每个字不同颜色同一行 -->
        <p><span class="zi1">蔡</span><span class="zi2">美</span><span class="zi3">琪</span></p>
        <p>CSS属性</p>
    </div>
    <!--扩展4：新加盒子，放学号，有宽高背景 -->
    <div id="stu-box">
        <p>学号：24001010120</p>
    </div>
</body>
</html>
