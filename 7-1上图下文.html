 <!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>上图下文</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(180deg, #f4f6fb 0%, #eef4ff 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
        }

        .slist {
            list-style: none;
            width: 1100px;
            max-width: 90%;
            display: flex;
            justify-content: center;
            gap: 28px;
            flex-wrap: wrap;
            padding: 40px 0;
        }

        .slist li {
            width: 300px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 12px 28px rgba(15, 23, 42, 0.12);
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }

        .slist li:hover {
            transform: translateY(-8px);
            box-shadow: 0 16px 35px rgba(37, 99, 235, 0.18);
        }

        .slist img {
            display: block;
            width: 100%;
            height: 220px;
            object-fit: cover;
        }

        .slist p {
            padding: 18px 16px 22px;
            font-size: 16px;
            color: #374151;
            text-align: center;
            background: #fff;
        }

        @media (max-width: 768px) {
            .slist {
                gap: 20px;
            }

            .slist li {
                width: 100%;
                max-width: 360px;
            }
        }
    </style>
</head>
<body>
    <a href="./index.html" aria-label="返回首页" style="position:fixed;top:12px;right:12px;z-index:9999;padding:9px 14px;border-radius:999px;background:#426b50;color:#fff;text-decoration:none;font:14px 'Microsoft YaHei',sans-serif;box-shadow:0 3px 12px rgba(0,0,0,.18)">← 返回首页</a>
    <ul class="slist">
        <li>
            <img src="./img/1.png" alt="图片1">
            <p>蔡美琪的标题1</p>
        </li>
        <li>
            <img src="./img/2.png" alt="图片2">
            <p>蔡美琪的标题2</p>
        </li>
        <li>
            <img src="./img/3.png" alt="图片3">
            <p>蔡美琪的标题3</p>
        </li>
    </ul>
</body>
</html>
