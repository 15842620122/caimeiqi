<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="theme-color" content="#173c31">
	<title>山野植物手册 · 蔡美琪</title>
	<style>
		:root {
			color-scheme: light;
			--forest: #173c31;
			--forest-deep: #102c25;
			--paper: #f1eee6;
			--paper-light: #faf8f2;
			--ink: #20251f;
			--muted: #77796e;
			--line: #ddd9ce;
			--rust: #c45a3d;
			--gold: #d9b767;
		}

		* {
			box-sizing: border-box;
		}

		html {
			scroll-behavior: smooth;
		}

		body {
			min-width: 320px;
			margin: 0;
			color: var(--ink);
			background: var(--paper);
			font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
		}

		a {
			color: inherit;
		}

		.site-header {
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 24px;
			width: min(100%, 1440px);
			min-height: 82px;
			margin: 0 auto;
			padding: 0 clamp(20px, 5vw, 76px);
		}

		.wordmark {
			display: flex;
			align-items: center;
			gap: 12px;
			text-decoration: none;
			font-size: 0.95rem;
			font-weight: 800;
			white-space: nowrap;
		}

		.wordmark-mark {
			display: grid;
			place-items: center;
			width: 34px;
			aspect-ratio: 1;
			border-radius: 50% 50% 50% 4px;
			background: var(--forest);
			color: var(--paper-light);
			font-family: Georgia, serif;
			font-size: 1.1rem;
			transform: rotate(-8deg);
		}

		.wordmark-name {
			display: grid;
			gap: 2px;
		}

		.wordmark-name small {
			color: var(--muted);
			font-size: 0.56rem;
			font-weight: 700;
			letter-spacing: 0.14em;
		}

		.primary-nav {
			display: flex;
			align-items: center;
			gap: clamp(16px, 3vw, 38px);
			color: #55594f;
			font-size: 0.8rem;
		}

		.primary-nav a {
			text-decoration: none;
			transition: color 180ms ease;
		}

		.primary-nav a:hover {
			color: var(--rust);
		}

		.issue {
			flex: 0 0 auto;
			padding: 9px 12px;
			border: 1px solid var(--line);
			color: var(--muted);
			font-size: 0.68rem;
			letter-spacing: 0.08em;
		}

		.hero {
			position: relative;
			isolation: isolate;
			overflow: hidden;
			background-color: var(--forest);
			background-image: linear-gradient(115deg, transparent 0 66%, rgba(255, 255, 255, 0.035) 66.1%, transparent 66.2%), repeating-linear-gradient(135deg, transparent 0 36px, rgba(255, 255, 255, 0.018) 36px 37px);
			color: var(--paper-light);
		}

		.hero-inner {
			display: grid;
			grid-template-columns: minmax(0, 1fr) minmax(280px, 0.72fr);
			align-items: center;
			gap: clamp(32px, 7vw, 100px);
			width: min(100%, 1440px);
			min-height: 590px;
			margin: 0 auto;
			padding: 54px clamp(20px, 8vw, 118px);
		}

		.hero-copy {
			max-width: 610px;
		}

		.hero-kicker {
			display: flex;
			align-items: center;
			gap: 10px;
			margin: 0 0 26px;
			color: var(--gold);
			font-size: 0.7rem;
			font-weight: 700;
			letter-spacing: 0.16em;
		}

		.hero-kicker::before {
			width: 27px;
			height: 1px;
			background: currentColor;
			content: "";
		}

		h1 {
			margin: 0;
			font-size: clamp(3rem, 6.4vw, 5.6rem);
			font-weight: 800;
			line-height: 1.12;
			letter-spacing: 0;
		}

		.hero-subtitle {
			max-width: 25em;
			margin: 24px 0 0;
			color: rgba(250, 248, 242, 0.76);
			font-size: 0.96rem;
			line-height: 1.9;
		}

		.hero-meta {
			display: flex;
			align-items: center;
			gap: 20px;
			margin-top: 38px;
			padding-top: 18px;
			border-top: 1px solid rgba(250, 248, 242, 0.2);
		}

		.hero-meta strong {
			font-size: 1.6rem;
			font-weight: 700;
		}

		.hero-meta span {
			color: rgba(250, 248, 242, 0.65);
			font-size: 0.7rem;
			line-height: 1.6;
		}

		.feature-plate {
			width: min(100%, 355px);
			margin: 0 auto;
			padding: 9px;
			background: #e9e2d3;
			box-shadow: 0 24px 55px rgba(5, 22, 17, 0.32);
			transform: rotate(1.5deg);
		}

		.feature-plate img {
			display: block;
			width: 100%;
			aspect-ratio: 3 / 4;
			object-fit: cover;
		}

		.feature-plate figcaption {
			display: flex;
			align-items: baseline;
			justify-content: space-between;
			gap: 12px;
			padding: 12px 5px 4px;
			color: #383c31;
			font-size: 0.76rem;
			font-weight: 700;
		}

		.feature-plate figcaption span:last-child {
			color: #77766d;
			font-size: 0.62rem;
			font-weight: 500;
			letter-spacing: 0.1em;
		}

		.collection {
			width: min(100%, 1290px);
			margin: 0 auto;
			padding: 78px clamp(20px, 5vw, 64px) 54px;
		}

		.section-heading {
			display: flex;
			align-items: flex-end;
			justify-content: space-between;
			gap: 24px;
			margin-bottom: 28px;
			padding-bottom: 18px;
			border-bottom: 1px solid var(--line);
		}

		.section-index {
			margin: 0 0 9px;
			color: var(--rust);
			font-size: 0.66rem;
			font-weight: 700;
			letter-spacing: 0.15em;
		}

		h2 {
			margin: 0;
			font-size: clamp(1.65rem, 3vw, 2.25rem);
			font-weight: 800;
			letter-spacing: 0;
		}

		.section-heading > p {
			margin: 0 0 3px;
			color: var(--muted);
			font-size: 0.78rem;
		}

		.plant-grid {
			display: grid;
			grid-template-columns: repeat(3, minmax(0, 1fr));
			gap: 22px;
		}

		.plant-card {
			min-width: 0;
			padding: 9px 9px 0;
			border: 1px solid rgba(37, 43, 34, 0.1);
			background: var(--paper-light);
			transition: transform 220ms ease, box-shadow 220ms ease;
		}

		.plant-card:hover {
			transform: translateY(-4px);
			box-shadow: 0 14px 30px rgba(40, 44, 33, 0.11);
		}

		.plant-card img {
			display: block;
			width: 100%;
			aspect-ratio: 3 / 4;
			object-fit: cover;
			background: #e8e1d3;
		}

		.plant-caption {
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 12px;
			min-height: 58px;
			padding: 12px 4px 13px;
			border-top: 1px solid var(--line);
		}

		.plant-caption h3 {
			margin: 0;
			font-size: 0.98rem;
			font-weight: 700;
			letter-spacing: 0;
		}

		.plant-caption span {
			color: var(--muted);
			font-size: 0.62rem;
			letter-spacing: 0.08em;
			white-space: nowrap;
		}

		.field-note {
			display: flex;
			align-items: flex-start;
			gap: 14px;
			max-width: 690px;
			margin: 54px auto 8px;
			padding: 20px 22px;
			border-left: 3px solid var(--rust);
			background: #e8e4d9;
			color: #56574d;
			font-size: 0.82rem;
			line-height: 1.8;
		}

		.field-note strong {
			flex: 0 0 auto;
			color: var(--forest);
		}

		.site-footer {
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 18px;
			width: min(100%, 1290px);
			margin: 0 auto;
			padding: 22px clamp(20px, 5vw, 64px) 30px;
			border-top: 1px solid var(--line);
			color: var(--muted);
			font-size: 0.68rem;
			letter-spacing: 0.08em;
		}

		@media (max-width: 900px) {
			.hero-inner {
				grid-template-columns: minmax(0, 1fr) minmax(240px, 0.68fr);
				gap: 36px;
				min-height: 520px;
				padding-inline: 7vw;
			}

			.plant-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
		}

		@media (max-width: 620px) {
			.site-header {
				min-height: 70px;
				padding-inline: 18px;
			}

			.primary-nav { display: none; }

			.hero-inner {
				grid-template-columns: minmax(0, 1fr);
				gap: 32px;
				padding: 48px 22px 44px;
			}

			.hero-copy { max-width: 34rem; }
			h1 { font-size: clamp(2.9rem, 14vw, 4.2rem); }
			.hero-subtitle { margin-top: 18px; }
			.hero-meta { margin-top: 26px; }
			.feature-plate { width: min(76%, 330px); }

			.collection { padding: 54px 16px 40px; }
			.plant-grid { gap: 13px; }
			.plant-card { padding: 6px 6px 0; }
			.plant-caption { min-height: 52px; padding: 9px 2px 10px; }
			.plant-caption h3 { font-size: 0.88rem; }
			.plant-caption span { font-size: 0.56rem; }
			.field-note { margin-top: 36px; padding: 17px; }
		}

		@media (max-width: 380px) {
			.issue { padding: 8px; font-size: 0.58rem; }
			.section-heading { align-items: flex-start; flex-direction: column; gap: 10px; }
			.plant-grid { grid-template-columns: minmax(0, 1fr); }
			.plant-card { padding: 8px 8px 0; }
			.plant-card img { aspect-ratio: 3 / 3.3; object-fit: cover; }
			.plant-caption { padding-inline: 6px; }
		}

		@media (prefers-reduced-motion: reduce) {
			html { scroll-behavior: auto; }
			.plant-card { transition: none; }
		}
	</style>
</head>
<body>
    <a href="./index.html" aria-label="返回首页" style="position:fixed;top:12px;right:12px;z-index:9999;padding:9px 14px;border-radius:999px;background:#426b50;color:#fff;text-decoration:none;font:14px 'Microsoft YaHei',sans-serif;box-shadow:0 3px 12px rgba(0,0,0,.18)">← 返回首页</a>
	<header class="site-header">
		<a class="wordmark" href="#top" aria-label="山野手记首页">
			<span class="wordmark-mark" aria-hidden="true">野</span>
			<span class="wordmark-name">山野手记<small>FIELD BOTANY</small></span>
		</a>
		<nav class="primary-nav" aria-label="主导航">
			<a href="#collection">植物图鉴</a>
			<a href="#field-note">野外札记</a>
		</nav>
		<span class="issue">FIELD GUIDE&nbsp; / &nbsp;01</span>
	</header>

	<main id="top">
		<section class="hero" aria-labelledby="page-title">
			<div class="hero-inner">
				<div class="hero-copy">
					<p class="hero-kicker">WILD PLANTS · FIELD NOTES</p>
					<h1 id="page-title">山野植物<br>手册</h1>
					<p class="hero-subtitle">沿着林间小径，认识叶片的脉络、果实的颜色，以及那些容易被忽略的生命细节。</p>
					<div class="hero-meta">
						<strong>10</strong>
						<span>种山野植物<br>一页一份观察记录</span>
					</div>
				</div>
				<figure class="feature-plate">
					<img src="./img/s1.jpg" alt="山莓植株、叶片与红色聚合果图解">
					<figcaption><span>山莓</span><span>FEATURED SPECIMEN&nbsp; / &nbsp;01</span></figcaption>
				</figure>
			</div>
		</section>

		<section class="collection" id="collection" aria-labelledby="collection-title">
			<div class="section-heading">
				<div>
					<p class="section-index">01 — FIELD INDEX</p>
					<h2 id="collection-title">林间图鉴</h2>
				</div>
				<p>从一片叶子，认出一座山的季节。</p>
			</div>

			<div class="plant-grid">
				<figure class="plant-card">
					<img src="./img/s2.jpg" alt="越橘的叶片、枝条与深色果实图解" loading="lazy">
					<figcaption class="plant-caption"><h3>越橘</h3><span>PLATE / 02</span></figcaption>
				</figure>
				<figure class="plant-card">
					<img src="./img/s3.jpg" alt="茅莓的锯齿叶片与红色聚合果图解" loading="lazy">
					<figcaption class="plant-caption"><h3>茅莓</h3><span>PLATE / 03</span></figcaption>
				</figure>
				<figure class="plant-card">
					<img src="./img/s4.jpg" alt="金樱子的枝刺与橙红色果实图解" loading="lazy">
					<figcaption class="plant-caption"><h3>金樱子</h3><span>PLATE / 04</span></figcaption>
				</figure>
				<figure class="plant-card">
					<img src="./img/s5.jpg" alt="火棘果枝条与橙色果实图解" loading="lazy">
					<figcaption class="plant-caption"><h3>火棘果</h3><span>PLATE / 05</span></figcaption>
				</figure>
				<figure class="plant-card">
					<img src="./img/s6.jpg" alt="花椒果的枝叶与果实图解" loading="lazy">
					<figcaption class="plant-caption"><h3>花椒果</h3><span>PLATE / 06</span></figcaption>
				</figure>
				<figure class="plant-card">
					<img src="./img/s7.jpg" alt="山茱萸的叶片与红色果实图解" loading="lazy">
					<figcaption class="plant-caption"><h3>山茱萸</h3><span>PLATE / 07</span></figcaption>
				</figure>
				<figure class="plant-card">
					<img src="./img/s8.jpg" alt="唐棣果的枝叶与果实图解" loading="lazy">
					<figcaption class="plant-caption"><h3>唐棣果</h3><span>PLATE / 08</span></figcaption>
				</figure>
				<figure class="plant-card">
					<img src="./img/s9.jpg" alt="银莓的银绿色叶片与红色果实图解" loading="lazy">
					<figcaption class="plant-caption"><h3>银莓</h3><span>PLATE / 09</span></figcaption>
				</figure>
				<figure class="plant-card">
					<img src="./img/s10.jpg" alt="南五加皮的野外植株照片" loading="lazy">
					<figcaption class="plant-caption"><h3>南五加皮</h3><span>PLATE / 10</span></figcaption>
				</figure>
			</div>

			<aside class="field-note" id="field-note">
				<strong>野外观察</strong>
				<span>图鉴用于形态识别与学习。请勿仅凭图片采食野果，观察时也尽量不折枝、不采摘。</span>
			</aside>
		</section>
	</main>

	<footer class="site-footer">
		<span>山野手记 · 植物观察图鉴</span>
		<span>记录 / 蔡美琪</span>
	</footer>
</body>
</html>
