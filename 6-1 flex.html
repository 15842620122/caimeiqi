<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(180deg, #f5f5f5 0%, #e6e6e6 100%);
            font-family: "Microsoft YaHei", sans-serif;
        }

        .container {
            width: 980px;
            margin: 60px auto 0;
        }

        h2 {
            text-align: center;
            font-size: 46px;
            font-weight: 500;
            color: #1d1d1d;
            letter-spacing: 2px;
            margin-bottom: 36px;
            text-shadow: 0 1px 0 rgba(255,255,255,0.5);
        }

        .flex-demo {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            padding: 12px 0;
        }

        .panel {
            width: 220px;
            height: 210px;
            border: 1px solid rgba(36, 36, 36, 0.8);
            background: linear-gradient(145deg, #fbfbfb 0%, #ededee 100%);
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.5), 0 2px 8px rgba(0,0,0,0.04);
            display: flex;
            padding: 18px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .panel:hover {
            transform: translateY(-2px);
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.7), 0 8px 18px rgba(0,0,0,0.06);
        }

        .box {
            width: 52px;
            height: 52px;
            border: 1px solid rgba(30, 30, 30, 0.9);
            background: linear-gradient(135deg, #f3f7ff 0%, #dfeaff 100%);
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.6);
        }

        .panel.first {
            justify-content: center;
            align-items: center;
        }

        .panel.first .box {
            width: 110px;
            height: 110px;
            background: linear-gradient(135deg, #edf4ff 0%, #dfe9ff 100%);
        }

        .panel.second {
            justify-content: space-around;
            align-items: center;
        }

        .panel.second .box {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, #edf5ff 0%, #dfe8ff 100%);
        }

        .panel.third {
            flex-wrap: wrap;
            justify-content: space-between;
            align-content: space-between;
        }

        .panel.third .box {
            width: 46px;
            height: 46px;
            background: linear-gradient(135deg, #eef7ff 0%, #ddeefc 100%);
        }

        .panel.fourth {
            justify-content: center;
            align-items: center;
        }

        .panel.fourth .inner {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-content: center;
            width: 136px;
            height: 136px;
        }

        .panel.fourth .box {
            width: 46px;
            height: 46px;
            margin: 6px;
            background: linear-gradient(135deg, #edf3ff 0%, #dde8ff 100%);
        }
    </style>
</head>
<body>
    <a href="./index.html" aria-label="返回首页" style="position:fixed;top:12px;right:12px;z-index:9999;padding:9px 14px;border-radius:999px;background:#426b50;color:#fff;text-decoration:none;font:14px 'Microsoft YaHei',sans-serif;box-shadow:0 3px 12px rgba(0,0,0,.18)">← 返回首页</a>
    <div class="container">
        <h2>Flex 布局演示</h2>

        <div class="flex-demo">
            <div class="panel first">
                <div class="box"></div>
            </div>

            <div class="panel second">
                <div class="box"></div>
                <div class="box"></div>
            </div>

            <div class="panel third">
                <div class="box"></div>
                <div class="box"></div>
                <div class="box"></div>
                <div class="box"></div>
            </div>

            <div class="panel fourth">
                <div class="inner">
                    <div class="box"></div>
                    <div class="box"></div>
                    <div class="box"></div>
                    <div class="box"></div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
