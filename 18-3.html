  <script>
    (function () {
      var svg = document.getElementById('cmqSvg');
      var grid = document.getElementById('cmqGridLayer');
      var pulse = document.getElementById('cmqPulseLayer');
      var flow = document.getElementById('cmqFlowLines');
      var btnFlow = document.getElementById('cmq_btnFlow');
      var btnGlow = document.getElementById('cmq_btnGlow');
      var btnBg = document.getElementById('cmq_btnBg');
      var btnExport = document.getElementById('cmq_btnExport');

      btnFlow.addEventListener('click', function () {
        btnFlow.classList.toggle('active');
        flow.style.opacity = btnFlow.classList.contains('active') ? '.85' : '0';
      });
      btnGlow.addEventListener('click', function () {
        btnGlow.classList.toggle('active');
        pulse.style.opacity = btnGlow.classList.contains('active') ? '1' : '0';
      });
      btnBg.addEventListener('click', function () {
        btnBg.classList.toggle('active');
        grid.style.opacity = btnBg.classList.contains('active') ? '1' : '0';
      });
      btnExport.addEventListener('click', function () {
        var xml = new XMLSerializer().serializeToString(svg);
        var blob = new Blob([xml], { type: 'image/svg+xml;charset=utf-8' });
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url; a.download = '知识库智能客服系统架构图.svg';
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
      });
    })();
  </script>
