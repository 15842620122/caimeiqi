<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>CSS Animation · 色彩循环</title>
	<style>
		:root {
			color-scheme: light;
			--ink: #172722;
			--muted: #718078;
			--paper: #f2f3eb;
			--line: #d8ddd2;
		}

		* {
			box-sizing: border-box;
		}

		body {
			min-height: 100vh;
			margin: 0;
			display: grid;
			place-items: center;
			padding: 54px 24px;
			color: var(--ink);
			background-color: var(--paper);
			background-image: linear-gradient(rgba(23, 39, 34, 0.025) 1px, transparent 1px), linear-gradient(90deg, rgba(23, 39, 34, 0.025) 1px, transparent 1px);
			background-size: 32px 32px;
			font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
		}

		.page {
			width: min(100%, 900px);
		}

		.eyebrow {
			display: flex;
			align-items: center;
			gap: 10px;
			color: var(--muted);
			font-size: 0.7rem;
			font-weight: 700;
			letter-spacing: 0.16em;
			text-transform: uppercase;
		}

		.eyebrow::before {
			width: 28px;
			height: 3px;
			content: "";
			background: #e57c5d;
		}

		h1 {
			margin: 16px 0 7px;
			font-size: clamp(2.1rem, 5vw, 3.2rem);
			line-height: 1.15;
			letter-spacing: 0;
		}

		.intro {
			margin: 0;
			color: var(--muted);
			font-size: 0.94rem;
			line-height: 1.8;
		}

		.stage {
			position: relative;
			display: grid;
			place-items: center;
			min-height: 430px;
			margin-top: 32px;
			overflow: hidden;
			border: 1px solid rgba(255, 255, 255, 0.12);
			border-radius: 14px;
			background-color: #1c3029;
			background-image: radial-gradient(ellipse at 50% 45%, rgba(126, 158, 112, 0.2), transparent 52%), linear-gradient(rgba(230, 241, 225, 0.035) 1px, transparent 1px), linear-gradient(90deg, rgba(230, 241, 225, 0.035) 1px, transparent 1px);
			background-size: auto, 32px 32px, 32px 32px;
			box-shadow: 0 24px 60px rgba(28, 48, 41, 0.16), inset 0 1px 0 rgba(255, 255, 255, 0.08);
		}

		.stage::before {
			position: absolute;
			top: 50%;
			left: 50%;
			width: min(62vw, 470px);
			aspect-ratio: 1;
			border: 1px solid rgba(226, 240, 217, 0.12);
			border-radius: 50%;
			content: "";
			box-shadow: 0 0 0 34px rgba(226, 240, 217, 0.025), 0 0 0 68px rgba(226, 240, 217, 0.02);
			transform: translate(-50%, -50%);
			animation: halo-breathe 7s ease-in-out infinite;
			pointer-events: none;
		}

		.color-box {
			position: relative;
			isolation: isolate;
			display: grid;
			place-content: center;
			width: min(62%, 330px);
			aspect-ratio: 1.16;
			overflow: hidden;
			border: 1px solid rgba(255, 255, 255, 0.7);
			border-radius: 26px;
			color: #1d302a;
			text-align: center;
			animation: color-cycle 12s ease-in-out infinite, box-drift 5s ease-in-out infinite alternate;
		}

		.color-box::before {
			position: absolute;
			z-index: 0;
			inset: 0;
			content: "";
			background: linear-gradient(145deg, rgba(255, 255, 255, 0.46), transparent 42%, rgba(20, 38, 35, 0.13));
			pointer-events: none;
		}

		.color-box::after {
			position: absolute;
			z-index: 0;
			top: -30%;
			left: -42%;
			width: 24%;
			height: 160%;
			content: "";
			background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.38), transparent);
			transform: rotate(32deg);
			animation: sheen-pass 6.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
			pointer-events: none;
		}

		.box-index {
			position: relative;
			z-index: 1;
			display: block;
			margin-bottom: 9px;
			font-size: 0.68rem;
			font-weight: 700;
			letter-spacing: 0.18em;
		}

		.box-title {
			position: relative;
			z-index: 1;
			margin: 0;
			font-size: clamp(1.6rem, 4vw, 2.2rem);
			font-weight: 800;
			letter-spacing: 0;
		}

		.box-caption {
			position: relative;
			z-index: 1;
			margin-top: 8px;
			font-size: 0.7rem;
			letter-spacing: 0.08em;
		}

		.stage-label {
			position: absolute;
			z-index: 1;
			top: 22px;
			left: 24px;
			color: rgba(240, 246, 235, 0.72);
			font-size: 0.66rem;
			font-weight: 700;
			letter-spacing: 0.15em;
		}

		.stage-number {
			position: absolute;
			z-index: 1;
			right: 24px;
			bottom: 20px;
			color: rgba(240, 246, 235, 0.55);
			font-size: 0.7rem;
			letter-spacing: 0.12em;
		}

		.palette {
			display: grid;
			grid-template-columns: repeat(4, minmax(0, 1fr));
			gap: 18px;
			margin-top: 26px;
		}

		.swatch {
			display: grid;
			grid-template-columns: auto 1fr;
			align-items: center;
			column-gap: 9px;
			row-gap: 9px;
			min-width: 0;
			color: var(--muted);
			font-size: 0.8rem;
			font-weight: 600;
		}

		.swatch::before {
			grid-column: 1 / -1;
			width: 100%;
			height: 4px;
			border-radius: 99px;
			content: "";
		}

		.swatch:nth-child(1)::before { background: #f27862; }
		.swatch:nth-child(2)::before { background: #f2c14e; }
		.swatch:nth-child(3)::before { background: #55b7a0; }
		.swatch:nth-child(4)::before { background: #718ee8; }

		.footnote {
			display: flex;
			justify-content: space-between;
			gap: 12px;
			margin-top: 28px;
			padding-top: 14px;
			border-top: 1px solid var(--line);
			color: var(--muted);
			font-size: 0.72rem;
		}

		@keyframes color-cycle {
			0%, 100% {
				background-color: #f27862;
				box-shadow: 0 26px 55px rgba(242, 120, 98, 0.27), inset 0 1px 0 rgba(255, 255, 255, 0.65);
			}
			25% {
				background-color: #f2c14e;
				box-shadow: 0 26px 55px rgba(242, 193, 78, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.65);
			}
			50% {
				background-color: #55b7a0;
				box-shadow: 0 26px 55px rgba(85, 183, 160, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.65);
			}
			75% {
				background-color: #718ee8;
				box-shadow: 0 26px 55px rgba(113, 142, 232, 0.27), inset 0 1px 0 rgba(255, 255, 255, 0.65);
			}
		}

		@keyframes box-drift {
			from { transform: translateY(5px) rotate(-1deg); }
			to { transform: translateY(-7px) rotate(1deg); }
		}

		@keyframes halo-breathe {
			0%, 100% {
				opacity: 0.55;
				transform: translate(-50%, -50%) scale(0.96);
			}
			50% {
				opacity: 1;
				transform: translate(-50%, -50%) scale(1.04);
			}
		}

		@keyframes sheen-pass {
			0%, 18% { transform: translateX(0) rotate(32deg); }
			48%, 100% { transform: translateX(600%) rotate(32deg); }
		}

		@media (max-width: 520px) {
			.stage {
				min-height: 350px;
			}

			.color-box {
				width: 72%;
				border-radius: 22px;
			}

			.palette {
				grid-template-columns: repeat(2, minmax(0, 1fr));
				row-gap: 18px;
			}

			.footnote {
				flex-wrap: wrap;
			}

			.stage-label { left: 16px; }
			.stage-number { right: 16px; }
		}

		@media (prefers-reduced-motion: reduce) {
			.stage::before,
			.color-box::after {
				animation: none;
			}

			.color-box {
				animation: none;
				background-color: #f27862;
				box-shadow: 0 26px 55px rgba(242, 120, 98, 0.27), inset 0 1px 0 rgba(255, 255, 255, 0.65);
			}
		}
	</style>
</head>
<body>
    <a href="./index.html" aria-label="返回首页" style="position:fixed;top:12px;right:12px;z-index:9999;padding:9px 14px;border-radius:999px;background:#426b50;color:#fff;text-decoration:none;font:14px 'Microsoft YaHei',sans-serif;box-shadow:0 3px 12px rgba(0,0,0,.18)">← 返回首页</a>
	<main class="page">
		<div class="eyebrow">CSS motion study <span>· 01</span></div>
		<h1>色彩，正在流动</h1>
		<p class="intro">一只盒子，四种颜色。让时间成为它的调色盘。</p>

		<section class="stage" aria-label="颜色循环动画展示区">
			<span class="stage-label">COLOR IN MOTION</span>
			<div class="color-box">
				<span class="box-index">COLOR / 01</span>
				<h2 class="box-title">色彩循环</h2>
				<span class="box-caption">A LITTLE MOTION</span>
			</div>
			<span class="stage-number">01 — 04&nbsp;&nbsp; / &nbsp;&nbsp;12 SEC</span>
		</section>

		<div class="palette" aria-label="动画颜色">
			<span class="swatch">珊瑚红</span>
			<span class="swatch">暖金黄</span>
			<span class="swatch">青柠绿</span>
			<span class="swatch">晴空蓝</span>
		</div>

		<footer class="footnote">
			<span>CSS @keyframes</span>
			<span>循环时长 · 12 秒</span>
		</footer>
	</main>
</body>
</html>
