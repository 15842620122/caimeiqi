<!-- 姓名：蔡美琪，日期：2026-11-02，功能名称：根据 URL 参数 fetch 单个商品并展示详情 -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>17-3 商品详情</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    background: #f5f6f8;
    padding: 28px 20px;
    color: #333;
  }
  .cmq_back {
    display: inline-block;
    margin-bottom: 18px;
    color: #2b5797;
    text-decoration: none;
    font-size: 14px;
  }
  .cmq_back:hover { text-decoration: underline; }

  .cmq_container {
    max-width: 1000px;
    margin: 0 auto;
  }

  .cmq_card {
    background: #fff;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 2px 14px rgba(0,0,0,.05);
  }

  .cmq_main {
    display: grid;
    grid-template-columns: 420px 1fr;
    gap: 32px;
    padding: 28px;
  }
  @media (max-width: 820px) {
    .cmq_main { grid-template-columns: 1fr; padding: 20px; }
  }

  /* ===== 左：图片 ===== */
  .cmq_gallery {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .cmq_main_img {
    width: 100%;
    aspect-ratio: 1 / 1;
    background: #f7f9fc;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }
  .cmq_main_img img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    transition: transform .3s;
  }
  .cmq_main_img:hover img { transform: scale(1.04); }
  .cmq_thumbs {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .cmq_thumb {
    width: 64px; height: 64px;
    border: 2px solid transparent;
    border-radius: 6px;
    cursor: pointer;
    overflow: hidden;
    background: #f7f9fc;
    display: flex; align-items: center; justify-content: center;
    padding: 0;
  }
  .cmq_thumb img {
    width: 100%; height: 100%; object-fit: cover;
  }
  .cmq_thumb.cmq_active { border-color: #2b5797; }

  /* ===== 右：信息 ===== */
  .cmq_info .cmq_brand_tag {
    display: inline-block;
    font-size: 11px;
    background: #eef4ff;
    color: #2b5797;
    padding: 3px 10px;
    border-radius: 12px;
    text-transform: uppercase;
    letter-spacing: .5px;
    font-weight: 600;
    margin-bottom: 10px;
  }
  .cmq_title {
    font-size: 24px;
    font-weight: 700;
    color: #1a1a1a;
    line-height: 1.35;
    margin-bottom: 10px;
  }
  .cmq_rating_bar {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 14px;
    font-size: 13px;
  }
  .cmq_stars { color: #f59e0b; font-weight: 600; font-size: 15px; }
  .cmq_stars span { color: #888; font-weight: 400; font-size: 12px; margin-left: 4px; }
  .cmq_stock_tag {
    padding: 2px 10px;
    border-radius: 10px;
    font-size: 11px;
    font-weight: 600;
  }
  .cmq_stock_tag.cmq_safe { background: #dcfce7; color: #15803d; }
  .cmq_stock_tag.cmq_low { background: #fef3c7; color: #92400e; }
  .cmq_stock_tag.cmq_out { background: #fee2e2; color: #b91c1c; }

  .cmq_desc {
    font-size: 14px;
    color: #555;
    line-height: 1.7;
    margin-bottom: 18px;
    padding: 14px 16px;
    background: #fafbfd;
    border-radius: 8px;
    border-left: 3px solid #2b5797;
  }

  .cmq_price_row {
    display: flex;
    align-items: baseline;
    gap: 12px;
    margin-bottom: 18px;
  }
  .cmq_price_now {
    font-size: 32px;
    font-weight: 700;
    color: #d9363e;
  }
  .cmq_price_old {
    font-size: 16px;
    color: #aaa;
    text-decoration: line-through;
  }
  .cmq_discount_tag {
    background: #ef4444;
    color: #fff;
    font-size: 12px;
    padding: 3px 10px;
    border-radius: 4px;
    font-weight: 600;
  }

  .cmq_meta {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px 20px;
    margin-bottom: 18px;
    font-size: 13px;
  }
  .cmq_meta .cmq_m_key { color: #999; }
  .cmq_meta .cmq_m_val { color: #222; font-weight: 500; }

  .cmq_tags { margin-bottom: 20px; }
  .cmq_tag {
    display: inline-block;
    font-size: 12px;
    color: #2b5797;
    background: #eef4ff;
    padding: 3px 10px;
    border-radius: 12px;
    margin-right: 6px;
    margin-bottom: 6px;
  }

  .cmq_actions {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }
  .cmq_btn {
    padding: 12px 28px;
    font-size: 14px;
    font-family: inherit;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    color: #fff;
    background: #2b5797;
    font-weight: 600;
    transition: background .2s, transform .1s;
  }
  .cmq_btn:hover { background: #1e3a8a; }
  .cmq_btn:active { transform: scale(.97); }
  .cmq_btn.cmq_btn_buy { background: #d9363e; }
  .cmq_btn.cmq_btn_buy:hover { background: #b91c1c; }
  .cmq_btn.cmq_btn_light { background: #eef4ff; color: #2b5797; }
  .cmq_btn.cmq_btn_light:hover { background: #dbeafe; }

  /* ===== 图片轮播条 ===== */
  .cmq_imgs_strip {
    border-top: 1px solid #eef1f6;
    padding: 18px 28px 22px;
  }
  .cmq_imgs_strip h3 {
    font-size: 14px;
    color: #555;
    margin-bottom: 12px;
  }
  .cmq_imgs {
    display: flex;
    gap: 10px;
    overflow-x: auto;
    padding-bottom: 4px;
  }
  .cmq_imgs img {
    width: 120px; height: 120px;
    object-fit: cover;
    border-radius: 8px;
    flex-shrink: 0;
    cursor: pointer;
    border: 2px solid transparent;
    transition: border-color .15s;
  }
  .cmq_imgs img:hover { border-color: #2b5797; }

  /* 错误 */
  .cmq_err {
    padding: 48px;
    text-align: center;
    color: #b91c1c;
    background: #fff;
    border-radius: 12px;
  }
  .cmq_err h2 { font-size: 20px; margin-bottom: 10px; }

  /* 骨架 */
  .cmq_sk { animation: cmq_pulse 1.4s ease-in-out infinite; }
  @keyframes cmq_pulse { 0%,100%{opacity:.5} 50%{opacity:1} }
  .cmq_sk_rect { background: #e5e7eb; border-radius: 6px; }
</style>
</head>
<body>

<a class="cmq_back" href="17-3.html">← 返回商品列表</a>
<a class="cmq_back" href="1.html" style="margin-left:14px">← 回到首页</a>

<div class="cmq_container" id="cmq_app"></div>

<script>
  function cmq_h(s) {
    return String(s == null ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function cmq_showSkeleton() {
    document.getElementById('cmq_app').innerHTML =
      '<div class="cmq_card cmq_sk">'
    +   '<div class="cmq_main">'
    +     '<div class="cmq_gallery">'
    +       '<div class="cmq_main_img cmq_sk_rect" style="width:420px;height:420px"></div>'
    +       '<div class="cmq_thumbs">'
    +         '<div class="cmq_sk_rect" style="width:64px;height:64px"></div>'
    +         '<div class="cmq_sk_rect" style="width:64px;height:64px"></div>'
    +         '<div class="cmq_sk_rect" style="width:64px;height:64px"></div>'
    +       '</div>'
    +     '</div>'
    +     '<div class="cmq_info">'
    +       '<div class="cmq_sk_rect" style="width:80px;height:24px;margin-bottom:12px"></div>'
    +       '<div class="cmq_sk_rect" style="height:32px;margin-bottom:10px"></div>'
    +       '<div class="cmq_sk_rect" style="height:20px;width:60%;margin-bottom:18px"></div>'
    +       '<div class="cmq_sk_rect" style="height:80px;margin-bottom:18px"></div>'
    +       '<div class="cmq_sk_rect" style="height:50px;width:70%"></div>'
    +     '</div>'
    +   '</div>'
    + '</div>';
  }

  function cmq_stockTag(stock) {
    if (stock <= 0) return '<span class="cmq_stock_tag cmq_out">缺货</span>';
    if (stock <= 5) return '<span class="cmq_stock_tag cmq_low">仅剩 ' + stock + ' 件</span>';
    return '<span class="cmq_stock_tag cmq_safe">库存充足</span>';
  }

  function cmq_price(p) {
    var has = p.discountPercentage && p.discountPercentage > 0;
    var now = has ? (p.price * (100 - p.discountPercentage) / 100).toFixed(2) : p.price;
    return { now: now, hasDiscount: has };
  }

  function cmq_render(p) {
    var price = cmq_price(p);
    var imgs = p.images && p.images.length ? p.images : [];
    var mainImg = imgs[0] || p.thumbnail || '';

    var html =
      '<div class="cmq_card">'
    +   '<div class="cmq_main">'
    +     '<div class="cmq_gallery">'
    +       '<div class="cmq_main_img">'
    +         '<img id="cmq_main_img" src="' + cmq_h(mainImg) + '" alt="' + cmq_h(p.title) + '" onerror="this.style.display=\'none\'">'
    +       '</div>'
    +       '<div class="cmq_thumbs" id="cmq_thumbs">';

    for (var i = 0; i < imgs.length; i++) {
      html += '<button class="cmq_thumb' + (i === 0 ? ' cmq_active' : '') + '" data-src="' + cmq_h(imgs[i]) + '">'
            +   '<img src="' + cmq_h(imgs[i]) + '" alt="" onerror="this.parentElement.style.display=\'none\'">'
            + '</button>';
    }
    html += '</div></div>'

    +     '<div class="cmq_info">'
    +       '<span class="cmq_brand_tag">' + cmq_h(p.brand || p.category || 'GENERIC') + '</span>'
    +       '<h1 class="cmq_title">' + cmq_h(p.title) + '</h1>'
    +       '<div class="cmq_rating_bar">'
    +         '<span class="cmq_stars">★ ' + cmq_h(p.rating) + '<span>评分</span></span>'
    +         cmq_stockTag(p.stock)
    +         '<span style="color:#888;font-size:12px">ID #' + cmq_h(p.id) + '</span>'
    +       '</div>'
    +       '<div class="cmq_desc">' + cmq_h(p.description) + '</div>'

    +       '<div class="cmq_price_row">'
    +         '<span class="cmq_price_now">¥' + cmq_h(price.now) + '</span>'
    +         (price.hasDiscount ? '<span class="cmq_price_old">¥' + cmq_h(p.price) + '</span>' : '')
    +         (price.hasDiscount ? '<span class="cmq_discount_tag">-' + cmq_h(p.discountPercentage.toFixed(0)) + '%</span>' : '')
    +       '</div>'

    +       '<div class="cmq_meta">'
    +         '<div><span class="cmq_m_key">分类：</span><span class="cmq_m_val">' + cmq_h(p.category || '-') + '</span></div>'
    +         '<div><span class="cmq_m_key">SKU：</span><span class="cmq_m_val">' + cmq_h(p.sku || '-') + '</span></div>'
    +         '<div><span class="cmq_m_key">重量：</span><span class="cmq_m_val">' + cmq_h(p.weight || '-') + '</span></div>'
    +         '<div><span class="cmq_m_key">宽度 × 高度 × 深：</span><span class="cmq_m_val">';
    if (p.dimensions) {
      html += cmq_h(p.dimensions.width) + ' × ' + cmq_h(p.dimensions.height) + ' × ' + cmq_h(p.dimensions.depth);
    } else { html += '-'; }
    html += '</span></div>'
    +         '<div><span class="cmq_m_key">保修：</span><span class="cmq_m_val">' + cmq_h(p.warrantyInformation || '-') + '</span></div>'
    +         '<div><span class="cmq_m_key">物流：</span><span class="cmq_m_val">' + cmq_h(p.shippingInformation || '-') + '</span></div>'
    +         '<div><span class="cmq_m_key">可用：</span><span class="cmq_m_val">' + cmq_h(p.availabilityStatus || '-') + '</span></div>'
    +         '<div><span class="cmq_m_key">退货：</span><span class="cmq_m_val">' + cmq_h(p.returnPolicy || '-') + '</span></div>'
    +       '</div>';

    if (p.tags && p.tags.length) {
      html += '<div class="cmq_tags">';
      for (var t = 0; t < p.tags.length; t++) {
        html += '<span class="cmq_tag">#' + cmq_h(p.tags[t]) + '</span>';
      }
      html += '</div>';
    }

    html +=
    +       '<div class="cmq_actions">'
    +         '<button class="cmq_btn cmq_btn_buy">立即购买</button>'
    +         '<button class="cmq_btn cmq_btn_light">加入购物车</button>'
    +         '<button class="cmq_btn">♥ 收藏</button>'
    +       '</div>'
    +     '</div>'
    +   '</div>';

    if (imgs.length > 0) {
      html += '<div class="cmq_imgs_strip">'
            +   '<h3>🎞 商品图集（共 ' + imgs.length + ' 张）</h3>'
            +   '<div class="cmq_imgs" id="cmq_imgs_strip">';
      for (var s = 0; s < imgs.length; s++) {
        html += '<img src="' + cmq_h(imgs[s]) + '" alt="" onerror="this.style.display=\'none\'">';
      }
      html += '</div></div>';
    }

    html += '</div>';
    document.getElementById('cmq_app').innerHTML = html;

    // 缩略图切换
    document.getElementById('cmq_thumbs').addEventListener('click', function (e) {
      var btn = e.target.closest('.cmq_thumb');
      if (!btn) return;
      document.querySelectorAll('#cmq_thumbs .cmq_thumb').forEach(function (b) {
        b.classList.remove('cmq_active');
      });
      btn.classList.add('cmq_active');
      document.getElementById('cmq_main_img').src = btn.getAttribute('data-src');
    });

    // 底部图集点击切换主图
    var strip = document.getElementById('cmq_imgs_strip');
    if (strip) {
      strip.addEventListener('click', function (e) {
        var img = e.target.closest('img');
        if (!img) return;
        document.getElementById('cmq_main_img').src = img.src;
      });
    }
  }

  function cmq_renderError(msg) {
    document.getElementById('cmq_app').innerHTML =
      '<div class="cmq_card"><div class="cmq_err">'
    +   '<h2>😵 获取商品失败</h2>'
    +   '<p>' + cmq_h(msg) + '</p>'
    +   '<br><a class="cmq_back" href="17-3.html">← 回列表</a>'
    + '</div></div>';
  }

  function cmq_getId() {
    var params = new URLSearchParams(window.location.search);
    return params.get('id');
  }

  function cmq_load() {
    var id = cmq_getId();
    if (!id) {
      cmq_renderError('URL 缺少 ?id= 参数，例如 <code>17-3-detail.html?id=1</code>');
      return;
    }
    cmq_showSkeleton();
    fetch('https://dummyjson.com/products/' + encodeURIComponent(id))
      .then(function (res) {
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.json();
      })
      .then(function (data) {
        if (data && data.message) throw new Error(data.message);
        cmq_render(data);
      })
      .catch(function (err) {
        cmq_renderError(err.message);
      });
  }

  cmq_load();
</script>

</body>
</html>
