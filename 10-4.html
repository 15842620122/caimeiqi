<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>10-4 响应式盒子 · 蔡美琪</title>
	<style>
		:root {
			color-scheme: light;
			--ink: #211c19;
			--muted: #81766e;
			--paper: #f1eee8;
			--line: #dfd8ce;
		}

		* {
			box-sizing: border-box;
		}

		body {
			min-width: 320px;
			min-height: 100vh;
			margin: 0;
			color: var(--ink);
			background-color: var(--paper);
			background-image: linear-gradient(rgba(33, 28, 25, 0.025) 1px, transparent 1px), linear-gradient(90deg, rgba(33, 28, 25, 0.025) 1px, transparent 1px);
			background-size: 34px 34px;
			font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
		}

		.page {
			width: min(100%, 1420px);
			margin: 0 auto;
			padding: clamp(28px, 5vw, 64px) clamp(18px, 4vw, 52px);
		}

		.masthead {
			display: flex;
			align-items: flex-end;
			justify-content: space-between;
			flex-wrap: wrap;
			gap: 20px;
			margin-bottom: 36px;
			padding-bottom: 26px;
			border-bottom: 1px solid var(--line);
		}

		.eyebrow {
			margin: 0 0 11px;
			color: #bb4935;
			font-size: 0.69rem;
			font-weight: 700;
			letter-spacing: 0.15em;
		}

		h1 {
			margin: 0;
			font-size: clamp(2rem, 5vw, 3.1rem);
			font-weight: 800;
			line-height: 1.15;
			letter-spacing: 0;
		}

		.deck {
			margin: 12px 0 0;
			color: var(--muted);
			font-size: 0.9rem;
			line-height: 1.7;
		}

		.author {
			flex: 0 0 auto;
			padding: 3px 0 3px 16px;
			border-left: 2px solid #bb4935;
			color: var(--muted);
			font-size: 0.8rem;
			letter-spacing: 0.08em;
		}

		.author strong {
			display: block;
			margin-top: 5px;
			color: var(--ink);
			font-size: 1rem;
		}

		.gallery {
			display: grid;
			grid-template-columns: minmax(0, 1fr);
			gap: 14px;
		}

		.tile {
			position: relative;
			display: flex;
			min-width: 0;
			min-height: 220px;
			flex-direction: column;
			justify-content: space-between;
			padding: 22px;
			overflow: hidden;
			border: 1px solid rgba(33, 28, 25, 0.09);
			border-radius: 6px;
			background-color: var(--tile-color);
			background-image: linear-gradient(145deg, rgba(255, 255, 255, 0.16), transparent 58%), repeating-linear-gradient(135deg, transparent 0 28px, rgba(255, 255, 255, 0.035) 28px 29px);
			color: var(--tile-ink);
			transition: transform 240ms ease, box-shadow 240ms ease, border-color 240ms ease;
		}

		.tile:hover {
			z-index: 1;
			transform: translateY(-5px);
			border-color: rgba(33, 28, 25, 0.2);
			box-shadow: 0 18px 32px rgba(49, 35, 29, 0.16);
		}

		.tile::before {
			position: absolute;
			z-index: 0;
			right: 8px;
			bottom: -20px;
			color: currentColor;
			content: var(--tile-number);
			font-size: 8rem;
			font-weight: 800;
			line-height: 1;
			opacity: 0.14;
			transition: transform 240ms ease, opacity 240ms ease;
			pointer-events: none;
		}

		.tile:hover::before {
			opacity: 0.2;
			transform: translate(-4px, -5px);
		}

		.tile::after {
			position: absolute;
			z-index: 1;
			top: 18px;
			right: 18px;
			width: 25px;
			height: 25px;
			border: 1px solid currentColor;
			border-bottom: 0;
			border-left: 0;
			content: "";
			opacity: 0.48;
			pointer-events: none;
		}

		.tile-top {
			position: relative;
			z-index: 1;
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 10px;
			font-size: 0.68rem;
			font-weight: 700;
			letter-spacing: 0.12em;
		}

		.tile-top span:last-child {
			width: 24px;
			height: 1px;
			background: currentColor;
			opacity: 0.6;
		}

		.tile h2 {
			position: relative;
			z-index: 1;
			margin: 40px 0 0;
			font-size: clamp(1.2rem, 2vw, 1.45rem);
			font-weight: 700;
			line-height: 1.3;
			letter-spacing: 0;
		}

		.tile:nth-child(1) { --tile-number: "01"; --tile-color: #c64e39; --tile-ink: #fff4e6; }
		.tile:nth-child(2) { --tile-number: "02"; --tile-color: #e3bc57; --tile-ink: #28251d; }
		.tile:nth-child(3) { --tile-number: "03"; --tile-color: #3e7867; --tile-ink: #f6f2e9; }
		.tile:nth-child(4) { --tile-number: "04"; --tile-color: #536d80; --tile-ink: #f7f1e9; }
		.tile:nth-child(5) { --tile-number: "05"; --tile-color: #d78c63; --tile-ink: #30251e; }
		.tile:nth-child(6) { --tile-number: "06"; --tile-color: #77805b; --tile-ink: #f8f2e8; }
		.tile:nth-child(7) { --tile-number: "07"; --tile-color: #a94f49; --tile-ink: #fff4e6; }
		.tile:nth-child(8) { --tile-number: "08"; --tile-color: #d8d2c5; --tile-ink: #28251f; }

		.footer {
			display: flex;
			justify-content: space-between;
			gap: 16px;
			margin-top: 24px;
			padding-top: 14px;
			border-top: 1px solid var(--line);
			color: var(--muted);
			font-size: 0.68rem;
			font-weight: 700;
			letter-spacing: 0.1em;
		}

		@media (min-width: 480px) {
			.gallery { grid-template-columns: repeat(2, minmax(0, 1fr)); }
		}

		@media (min-width: 760px) {
			.gallery { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
			.tile { min-height: 240px; padding: 26px; }
		}

		@media (min-width: 1100px) {
			.gallery { grid-template-columns: repeat(4, minmax(0, 1fr)); }
			.tile { min-height: 260px; }
		}

		@media (prefers-reduced-motion: reduce) {
			.tile { transition: none; }
		}
	</style>
</head>
<body>
    <a href="./index.html" aria-label="返回首页" style="position:fixed;top:12px;right:12px;z-index:9999;padding:9px 14px;border-radius:999px;background:#426b50;color:#fff;text-decoration:none;font:14px 'Microsoft YaHei',sans-serif;box-shadow:0 3px 12px rgba(0,0,0,.18)">← 返回首页</a>
	<main class="page">
		<header class="masthead">
			<div>
				<p class="eyebrow">CSS MEDIA QUERY / 10-4</p>
				<h1>八格，随屏幕舒展</h1>
				<p class="deck">八种色彩，各有性格；屏幕变宽，队形也随之展开。</p>
			</div>
			<div class="author">DESIGNED BY<strong>蔡美琪</strong></div>
		</header>

		<section class="gallery" aria-label="响应式八格布局">
			<article class="tile"><div class="tile-top"><span>FRAME / 01</span><span></span></div><h2>第一格 · 初见</h2></article>
			<article class="tile"><div class="tile-top"><span>FRAME / 02</span><span></span></div><h2>第二格 · 暖意</h2></article>
			<article class="tile"><div class="tile-top"><span>FRAME / 03</span><span></span></div><h2>第三格 · 生长</h2></article>
			<article class="tile"><div class="tile-top"><span>FRAME / 04</span><span></span></div><h2>第四格 · 静谧</h2></article>
			<article class="tile"><div class="tile-top"><span>FRAME / 05</span><span></span></div><h2>第五格 · 暮色</h2></article>
			<article class="tile"><div class="tile-top"><span>FRAME / 06</span><span></span></div><h2>第六格 · 远方</h2></article>
			<article class="tile"><div class="tile-top"><span>FRAME / 07</span><span></span></div><h2>第七格 · 回望</h2></article>
			<article class="tile"><div class="tile-top"><span>FRAME / 08</span><span></span></div><h2>第八格 · 余韵</h2></article>
		</section>

		<footer class="footer">
			<span>RESPONSIVE GRID</span>
			<span>320PX — WIDE SCREEN</span>
		</footer>
	</main>
</body>
</html>
