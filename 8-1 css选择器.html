<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>css3</title>
    <style>
        .main{
            display: flex;
            flex-wrap: wrap;
            margin:10px;
        }
        .box{
            width: 150px;
            height: 150px;
            border: 1px solid #ccc;
            margin: 10px;
            display: flex;
            /*水平垂直居中*/
            justify-content: center;
            align-items: center;
            font-size: 40px;
            transition:all 0.6s;
            box-sizing: border-box;
            /*width:包含padding和border*/
        }
        .box:first-child:hover
        {
            background-color: red;
            color: white;
            font-size: 140px;
        }
        .box:nth-child(even):hover
        {
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
            color: #333;
            border: 3px solid #ff6b6b;
            box-shadow: 0 12px 20px rgba(0, 0, 0, 0.2), inset 0 0 18px rgba(255, 255, 255, 0.5);
            filter: brightness(1.08);
        }
        .box:nth-child(2):hover
        {
            border-radius: 50%;
            border-width: 10px;
            transform: scale(1.08) rotate(10deg);
            box-shadow: 0 0 25px rgba(255, 107, 107, 0.7), inset 0 0 18px rgba(255, 255, 255, 0.5);
        }
        .box:nth-child(3):hover
        {
            box-shadow: 10px  10px  10px #ccc;
        }
        .box:nth-of-type(4):hover
        {
            text-shadow: 100px 10px 10px #5c3abb;
        }
        .box:nth-of-type(5):hover
        {
        /*线性渐变*/
        background: linear-gradient(red,blue);
        }
        .box:nth-of-type(5)+.box
        {
            /*径向渐变*/
            background: radial-gradient(red,blue);
        }
        .box:nth-of-type(7):hover
        {
            transform:scale(0.5);

        }
        .box:nth-child(8):hover
        {
            transform:translateX(-150px);
        }
        .box:nth-child(9):hover
        {
            transform:rotateX(-180deg);
        }
        .box:nth-child(10):hover
        {
            transform:skewX(20deg) translateY(50px);
        }
        .box:nth-last-child(2):hover::before
        {
            content: "*";
            color: red;
        }
        .box:last-child:hover{
            background-color: #1f1f1f;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
            text-align: center;
        }
        .box:last-child:hover::before{
            content: "蔡美琪";
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            background: #1f1f1f;
            color: #fff;
            font-weight: 700;
        }
        .box:last-child{
            position: relative;
        }
    </style>
</head>
<body>
    <a href="./index.html" aria-label="返回首页" style="position:fixed;top:12px;right:12px;z-index:9999;padding:9px 14px;border-radius:999px;background:#426b50;color:#fff;text-decoration:none;font:14px 'Microsoft YaHei',sans-serif;box-shadow:0 3px 12px rgba(0,0,0,.18)">← 返回首页</a>
    <div class="main">
    <div class="box">1</div>
    <div class="box">2</div>
    <div class="box">3</div>
    <div class="box">4</div>
    <div class="box">5</div>
    <div class="box">6</div>
    <div class="box">7</div>
    <div class="box">8</div>
    <div class="box">9</div>
    <div class="box">10</div>
    <div class="box">11</div>
    <div class="box">12</div>
    </div>
    
</body>
</html>
